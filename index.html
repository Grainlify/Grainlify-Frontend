
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- The saved theme, applied before first paint. It used to be set only
           once React ran, so a dark-mode visitor saw the light background and
           then a flip to dark. Kept above the stylesheet: an inline script
           placed after a stylesheet stops the parser until that stylesheet
           has downloaded. -->
      <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
      <!-- The commit this build came from, injected by Vite from the
           platform's build environment. It exists so "is it deployed" is a
           fetch and a string comparison rather than somebody loading the page
           and believing it - work that was never committed, work merged but
           not deployed, and work actually live otherwise look identical from
           outside. Reads "unknown" when the platform supplied nothing, which
           is a failed check rather than a passing one. -->
      <meta name="grainlify:commit" content="%VITE_BUILD_COMMIT%" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <!-- Warms the connection to hosts every page hits almost immediately on load,
           so the first API request / avatar image doesn't pay DNS+TCP+TLS cold. -->
      <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
      <link rel="preconnect" href="https://github.com" />
      <link rel="preconnect" href="https://images.unsplash.com" />
      <!-- Inter, requested here rather than @import-ed from src/styles/fonts.css.
           An @import is inlined into the built stylesheet, so the request could
           not be discovered until 336 kB of CSS had downloaded and parsed -
           about 1.1 seconds in series on every page. Both preconnects are
           needed: googleapis serves the CSS, gstatic serves the font files,
           and the second is crossorigin because fonts are fetched in CORS
           mode. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      />
      <title>Grainlify</title>
      <!-- home-meta: the home page's description and link-preview tags. The
           docs prerender (src/features/docs/prerender.ts) removes everything
           between these two markers and writes each docs page's own tags, so
           a shared docs link never previews as the home page. -->
      <meta name="description" content="Open-source issues assigned by a weighted draw, not first-come. GrainHack events and Grainlify Bounties, which pay USDC on Solana, run on rules published before anyone applies." />
      <link rel="canonical" href="https://grainlify.com/" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Grainlify" />
      <meta property="og:title" content="Grainlify: funded issues aren't first-come" />
      <meta property="og:description" content="Open-source issues assigned by a weighted draw, not first-come. GrainHack events and Grainlify Bounties, which pay USDC on Solana, run on rules published before anyone applies." />
      <meta property="og:url" content="https://grainlify.com/" />
      <meta property="og:image" content="https://grainlify.com/og-home.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Grainlify. Funded issues aren't first-come. A weighted draw assigns them." />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:site" content="@Grainlify" />
      <meta name="twitter:title" content="Grainlify: funded issues aren't first-come" />
      <meta name="twitter:description" content="Open-source issues assigned by a weighted draw, not first-come. GrainHack events and Grainlify Bounties, which pay USDC on Solana, run on rules published before anyone applies." />
      <meta name="twitter:image" content="https://grainlify.com/og-home.png" />
      <!-- /home-meta -->
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
