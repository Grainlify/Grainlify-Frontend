name: CI

# Scoped to this working branch, not main - production is deployed by hand
# from this exact branch today. Gating automation on an eventual main merge
# (undated, non-trivial given the structural divergence between branches)
# would mean indefinitely more manual deploys. Revisit this trigger if/when
# this branch merges into main.
on:
  push:
    branches: [design/discover-page-redesign]
  pull_request:
    branches: [design/discover-page-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # jsdom 30's undici dependency needs worker_threads.markAsUncloneable
          # (added in Node 21); 22 is current LTS.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # No lint step: no ESLint config exists on this branch. Bootstrapping
      # one (rule set, fixing latent violations, husky/prettier wiring) is a
      # separate initiative from test coverage.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build project artifacts
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy prebuilt artifacts
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # Verifies the artifact that's actually live, not just that the build
      # succeeded - a pre-deploy test runs against source code, never
      # against what Vercel's own env var resolution and CDN actually serve.
      # Added after a real incident: a Vercel env var typed "Sensitive"
      # silently baked the literal string "[SENSITIVE]" into the production
      # bundle instead of the real backend URL (Vercel only resolves
      # Sensitive vars during its own native builds, not CLI-driven ones
      # like this deploy job), breaking sign-in with no error anywhere in
      # this pipeline. The build succeeded; the deploy succeeded; the site
      # was still broken. This step exists so that specific failure mode -
      # and the general class of "build fine, serve broken" - shows up here
      # instead of being discovered by a user.
      - name: Smoke test production
        run: |
          # This step has failed twice before for two different real reasons
          # (see git log for both), and a third time for a subtler one worth
          # recording: the homepage fetch and the bundle fetch used to be a
          # loop-then-single-shot pair - retry the HTML until it looks right,
          # then fetch whatever bundle path it named exactly once. Vercel's
          # HTML cache and its asset routing for the production alias don't
          # necessarily flip at the same instant: an attempt can see a
          # stale-but-plausible HTML naming an old bundle hash that the alias
          # has already stopped serving, so that one unretried bundle fetch
          # 404s (confirmed directly: the exact hash CI rejected was live and
          # correct by hand seconds later, under a *different*, newer hash).
          # Retry the whole thing - HTML fetch, bundle fetch, and content
          # checks - as one unit so an inconsistent snapshot just tries again
          # instead of failing on a deploy that's actually fine.
          echo "Checking the homepage loads with a consistent, verifiable bundle..."
          html=""
          success=false
          for i in $(seq 1 12); do
            html=$(curl -sf -m 15 https://grainlify.0xo.in/ || true)
            bundle_path=$(echo "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if ! echo "$html" | grep -q "<title>Grainlify</title>" || [ -z "$bundle_path" ]; then
              echo "Attempt $i: homepage not ready yet"
              sleep 5
              continue
            fi

            bundle=$(curl -sf -m 15 "https://grainlify.0xo.in$bundle_path" || true)
            if [ -z "$bundle" ]; then
              echo "Attempt $i: homepage named $bundle_path but it wasn't fetchable yet (stale HTML vs. already-rotated asset routing) - retrying"
              sleep 5
              continue
            fi

            if echo "$bundle" | grep -q '\[SENSITIVE\]'; then
              echo "::error::Production bundle contains the literal string [SENSITIVE] - a Vercel env var is misconfigured as Sensitive and isn't resolving for CLI-driven builds. See VITE_API_BASE_URL in the Vercel dashboard (must be Non-sensitive)."
              exit 1
            fi
            if ! echo "$bundle" | grep -qE "https://api\.grainlify\.0xo\.in"; then
              echo "Attempt $i: fetched $bundle_path but it's missing the expected API URL - retrying in case this was a stale/inconsistent response"
              sleep 5
              continue
            fi

            echo "Homepage + bundle OK on attempt $i: $bundle_path"
            success=true
            break
          done

          if [ "$success" != true ]; then
            echo "::error::Could not confirm a consistent, correctly-built production deploy within 60s"
            echo "Last homepage response (first 2000 chars):"
            echo "$html" | head -c 2000
            exit 1
          fi
